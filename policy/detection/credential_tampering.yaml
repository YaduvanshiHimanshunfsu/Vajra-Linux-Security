id: AG-RULE-003
version: 1
title: Sensitive credential repository or shadow file access
enabled: true
when:
  event_type: FILE_ACCESS
  object_type: file
  path_prefixes:
    - /etc/shadow
    - /etc/gshadow
    - /root/.ssh/
    - /var/run/secrets/kubernetes.io/serviceaccount/token
    - /app/.env
then:
  severity: critical
  mitre_techniques:
    - T1003.008
    - T1552.001
  response_mode: freeze_and_alert
  recommended_action: Freeze workload cgroup immediately to prevent exfiltration and preserve volatile evidence.
