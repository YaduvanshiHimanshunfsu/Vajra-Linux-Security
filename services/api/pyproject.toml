[project]
name = "aegisgraph-api"
version = "0.1.0"
description = "AegisGraph API and event-contract boundary"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
