[project]
name = "aegisgraph-detector"
version = "0.1.0"
description = "AegisGraph explainable behavioural detector"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3.0",
  "pyyaml>=6.0,<7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
