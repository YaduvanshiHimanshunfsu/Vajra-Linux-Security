[package]
name = "vajra-agent"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Privileged Linux eBPF telemetry sensor agent for Vajra"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.24"
libc = "0.2"

[lints.rust]
unsafe_code = "allow"
